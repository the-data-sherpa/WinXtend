[package]
name = "wx-agent"
description = "WinXtend headless agent daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# A library as well as a binary: the UI process shares the IPC types rather than
# restating them, and the pure logic (layout guessing, hotkey matching, disconnect
# recovery) is then testable without starting a daemon.
[lib]
name = "wx_agent"
path = "src/lib.rs"

[[bin]]
name = "wx-agent"
path = "src/main.rs"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }

[dependencies]
wx-proto.workspace = true
wx-core.workspace = true
anyhow.workspace = true
tracing.workspace = true
wx-platform = { version = "0.1.0", path = "../wx-platform" }
wx-net = { version = "0.1.0", path = "../wx-net" }
serde = { workspace = true, features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
clap = { version = "4.5.61", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.0.7"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
hostname = "0.4.2"
hex.workspace = true
thiserror.workspace = true
getrandom = "0.3.4"
# Clipboard payload compression. Same version `wx-video` already builds, so the
# dependency is proven in-tree on every target this ships to.
zstd = "0.13.3"

[target."cfg(target_os = \"linux\")".dependencies]
# Autostart writes a systemd user unit, which lives under $XDG_CONFIG_HOME —
# not under the per-application config directory `wx-net` resolves. `BaseDirs`
# is the same crate that already resolves the latter, and it applies the XDG
# rule that a relative XDG_CONFIG_HOME is ignored rather than joined onto the
# current directory.
directories = "6.0.0"

[target."cfg(windows)".dependencies]
# Win32_Security is not for security work: RegCreateKeyExW takes a
# SECURITY_ATTRIBUTES pointer, so the windows crate gates it behind that feature
# even though autostart passes NULL and inherits the default descriptor.
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
] }
