[package]
name = "wx-platform"
description = "WinXtend platform abstraction: input capture, input injection, displays, clipboard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
wx-proto.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Shutdown", "Win32_System_StationsAndDesktops"] }

[target."cfg(target_os = \"linux\")".dependencies]
# Display enumeration, straight off the compositor.
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.12", features = ["client", "unstable"] }
# Already in the tree via wayland-backend; a direct edge adds no crate to the build.
rustix = { version = "1.1.4", features = ["event", "time"] }
# The portal session. `ashpd` wraps the `Request`-object dance that every
# xdg-desktop-portal call is; `reis` speaks the libei protocol in pure Rust, so no
# machine — CI included — needs `libei-dev` or a C toolchain to build this.
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
reis = { version = "0.7.0", features = ["tokio"] }
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync", "macros"] }
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
