<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WinXtend</title>
  </head>
  <body>
    <div id="app">
      <header class="chrome">
        <div class="identity">
          <span class="wordmark">WinXtend</span>
          <span id="local-name" class="local-name"></span>
          <!-- In the chrome rather than on a tab: which machine has the cursor is
               the one thing a user looks up while looking at the other machine's
               screen, and the Status tab is not what is on screen when they do.
               `role="status"` so the change is announced when ownership moves,
               which happens without the user touching this window. -->
          <span id="cursor" class="cursor-badge" role="status" aria-live="polite"></span>
        </div>
        <nav class="tabs" id="tabs" role="tablist">
          <button type="button" role="tab" data-view="devices">Devices</button>
          <button type="button" role="tab" data-view="layout">Layout</button>
          <button type="button" role="tab" data-view="status">Status</button>
        </nav>
        <div id="connection" class="connection"></div>
      </header>

      <div id="banner" class="banner" hidden></div>

      <main id="views">
        <section id="view-devices" class="view" role="tabpanel"></section>
        <section id="view-layout" class="view" role="tabpanel" hidden></section>
        <section id="view-status" class="view" role="tabpanel" hidden></section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
