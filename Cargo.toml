[workspace]
resolver = "2"
members = [
    "crates/wx-proto",
    "crates/wx-core",
    "crates/wx-platform",
    "crates/wx-net",
    "crates/wx-video",
    "crates/wx-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# Set by the Wayland portal path: `zbus`, and `ashpd` on top of it, both declare
# 1.87. Nothing else here needs it, but `rust-version` is not target-aware, so the
# workspace has to state the highest of them or a build on an older toolchain fails
# with a dependency error rather than a clear "this crate needs a newer Rust".
rust-version = "1.87"

[workspace.dependencies]
wx-proto = { path = "crates/wx-proto" }
wx-core = { path = "crates/wx-core" }

serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Input latency is the whole product; don't ship a debug build that stutters.
[profile.dev]
opt-level = 1
